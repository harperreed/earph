# ABOUTME: Defines the shared engine and offline qualification workspace.
# ABOUTME: Pins dependencies and keeps native adapters outside the core.
[workspace]
members = ["crates/earph-core", "crates/earph-harness", "crates/earph-alsa", "crates/earph-coreaudio", "crates/earph-media", "crates/earph-engine"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
