# ABOUTME: Defines the private local engine owner and command client.
# ABOUTME: Keeps IPC and operational persistence outside the product domain.
[package]
name = "earph-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
earph-core = { path = "../earph-core" }
earph-dsp = { path = "../earph-dsp" }
earph-media = { path = "../earph-media" }
earph-network = { path = "../earph-network" }
earph-sendspin = { path = "../earph-sendspin" }
earph-credentials = { path = "../earph-credentials" }
tokio = { version = "=1.54.1", features = ["sync"] }
getrandom = "=0.3.4"
base64 = "=0.23.1"
earph-coreaudio = { path = "../earph-coreaudio" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rustix = { version = "=1.1.6", features = ["event", "fs", "net", "process"] }
signal-hook.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
earph-alsa = { path = "../earph-alsa" }

[dev-dependencies]
snow = { version = "=0.10.0", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
earph-harness = { path = "../earph-harness" }
rustix = { version = "=1.1.6", features = ["pipe"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[[test]]
name = "sendspin_credentials_process"
path = "tests/sendspin_credentials_process.rs"
harness = false

[[test]]
name = "sendspin_owner"
path = "tests/sendspin_owner.rs"
harness = false

[[test]]
name = "sendspin_cli"
path = "tests/sendspin_cli.rs"
harness = false

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = "=5.19.0"
