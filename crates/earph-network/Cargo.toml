# ABOUTME: Defines the admitted network media source adapter.
# ABOUTME: Keeps transport ownership outside the core and media decoders.
[package]
name = "earph-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
earph-core = { path = "../earph-core" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "io-util"] }
quick-xml = { version = "=0.41.0", default-features = false }

hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.5", default-features = false }
bytes = "=1.12.2"
socket2 = { version = "=0.6.5", default-features = false, features = ["all"] }

[dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }
