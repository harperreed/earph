# ABOUTME: Defines the native committed-credential helper and supervisor.
# ABOUTME: Keeps native secret storage outside Core and Network.
[package]
name = "earph-credentials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
earph-sendspin = { path = "../earph-sendspin" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rustix = { version = "=1.1.6", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0" }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"
core-foundation = "=0.10.1"

[[test]]
name = "process"
path = "tests/process.rs"
harness = false
