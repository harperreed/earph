# ABOUTME: Defines the Linux ALSA adapter and explicit output spike.
# ABOUTME: Links native audio dependencies only on Linux.
[package]
name = "earph-alsa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
earph-core = { path = "../earph-core" }
earph-harness = { path = "../earph-harness" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
alsa-sys = "=0.6.1"
libc = "=0.2.191"
